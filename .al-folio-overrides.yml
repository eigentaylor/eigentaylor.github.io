# Local overrides of plugin-owned paths for this site.
# Generated by: bundle exec al-folio upgrade overrides accept
# These files intentionally shadow gem-owned components for site-specific customization.
# Run `bundle exec al-folio upgrade overrides audit` to review upstream diffs before gem upgrades.
#
# Note: assets/js/distillpub/overrides.js is deliberately NOT listed here. It was renamed to
# assets/js/distillpub/site-overrides.js because al_folio_distill's AssetsGenerator
# unconditionally re-registers its own bundled assets/js/distillpub/overrides.js on every
# build, and Jekyll's last-write-wins static file handling let that clobber this site's
# customized copy in the built output regardless of this acknowledgement file. Renaming
# avoids the path collision entirely; see _includes/distill_scripts.liquid.

overrides:
  _includes:
    - distill_scripts.liquid
    - header.liquid
    - metadata.liquid
    - newsletter.liquid
    - related_posts.liquid
    - plugins/al_icons_styles.liquid
    - plugins/al_search_assets.liquid
  _layouts:
    - about.liquid
    - default.liquid
    - distill.liquid
    - post.liquid
  _sass:
    - _base.scss
    - _distill.scss
    - font-awesome/_functions.scss
    - font-awesome/_icons.scss
    - font-awesome/_mixins.scss
    - font-awesome/brands.scss
    - tabler-icons/tabler-icons-filled.scss
    - tabler-icons/tabler-icons-outline.scss
    - tabler-icons/tabler-icons.scss
  _scripts:
    - search.liquid.js
